# Flicktail → TestFlight.
#
# The pipeline proven on LUMEN (Capacitor) and BulkSift (Expo), with their
# hard-won fixes kept:
#   - newest Xcode on the runner (old SDKs are refused at UPLOAD, not build)
#   - the iOS project is GENERATED here (`cap add ios`), never committed
#   - Capacitor writes CODE_SIGN_IDENTITY = "iPhone Developer"; those lines
#     must be DELETED or automatic signing requests a development profile,
#     which needs registered devices this account does not have
#   - archive UNSIGNED, sign at export with the ASC API key
#     (-allowProvisioningUpdates also registers the App ID + profile)
#   - build number = run number (Apple refuses repeats)
#   - the ASC key secret is base64; strip non-base64 bytes before decoding
#     (a secret pasted from Windows carries a trailing CR)
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64, APPLE_TEAM_ID

name: ios

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload the build to TestFlight'
        type: boolean
        default: true
  push:
    tags: ['v*']

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on this runner
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Copy the game into the shell
        run: node mobile/sync-web.mjs

      - name: Install Capacitor and generate the iOS project
        working-directory: mobile
        run: |
          npm install
          npx cap add ios
          # Capacitor 7 defaults the deployment target to iOS 14.0, which trips
          # ITMS-90068 (Apple requires 15.0+ from Spring 2027). Raise it in both
          # the Podfile and the app project BEFORE cap sync runs pod install, so
          # MinimumOSVersion in the built Info.plist reads 15.0.
          if [ -f ios/App/Podfile ]; then
            sed -i '' "s/platform :ios, '[0-9.]*'/platform :ios, '15.0'/" ios/App/Podfile
            grep 'platform :ios' ios/App/Podfile
          fi
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' ios/App/App.xcodeproj/project.pbxproj
          grep -m1 'IPHONEOS_DEPLOYMENT_TARGET' ios/App/App.xcodeproj/project.pbxproj
          npx cap sync ios

      # `cap add ios` leaves Capacitor's own placeholder icon in the catalog.
      - name: Install the app icon
        working-directory: mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset
        run: |
          rm -f *.png
          cp "$GITHUB_WORKSPACE/assets/icon-1024-ios.png" AppIcon-512@2x.png
          cat > Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-512@2x.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          ls -l

      - name: Install the launch image
        working-directory: mobile/ios/App/App/Assets.xcassets/Splash.imageset
        run: |
          rm -f *.png
          for n in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do
            cp "$GITHUB_WORKSPACE/assets/splash-2732.png" "$n"
          done
          ls -l

      # ITSAppUsesNonExemptEncryption=false answers the export-compliance
      # question permanently (the game does HTTPS only). Portrait is locked —
      # a mid-run rotation on a physics table is a death. UIRequiresFullScreen
      # keeps it out of iPad multitasking for the same reason.
      - name: Info.plist facts
        working-directory: mobile/ios/App/App
        run: |
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist || $PB -c "Set :ITSAppUsesNonExemptEncryption false" Info.plist
          $PB -c "Add :UIRequiresFullScreen bool true" Info.plist || $PB -c "Set :UIRequiresFullScreen true" Info.plist
          $PB -c "Delete :UISupportedInterfaceOrientations" Info.plist || true
          $PB -c "Add :UISupportedInterfaceOrientations array" Info.plist
          $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" Info.plist
          $PB -c "Delete :UISupportedInterfaceOrientations~ipad" Info.plist || true
          $PB -c "Add :UISupportedInterfaceOrientations~ipad array" Info.plist
          $PB -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationPortrait" Info.plist
          $PB -c "Print" Info.plist | grep -E "NonExempt|FullScreen|Orientation" -A 2

      - name: Stamp the version
        working-directory: mobile/ios/App
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: 1.0.0
        run: |
          python3 - <<'PY'
          import io, os, re
          p = 'App.xcodeproj/project.pbxproj'
          s = io.open(p, encoding='utf-8').read()
          v, b = os.environ['VERSION_NAME'], os.environ['BUILD_NUMBER']
          s, n1 = re.subn(r'MARKETING_VERSION = [^;]+;', 'MARKETING_VERSION = %s;' % v, s)
          s, n2 = re.subn(r'CURRENT_PROJECT_VERSION = [^;]+;', 'CURRENT_PROJECT_VERSION = %s;' % b, s)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('MARKETING_VERSION=%s in %d configs, CURRENT_PROJECT_VERSION=%s in %d' % (v, n1, b, n2))
          if n1 == 0 or n2 == 0:
              raise SystemExit('generated project did not carry the expected settings')
          PY

      # See the header: the identity lines must go, not change.
      - name: Let automatic signing choose the identity
        working-directory: mobile/ios/App
        run: |
          grep -n 'CODE_SIGN_IDENTITY' App.xcodeproj/project.pbxproj || echo "(none)"
          sed -i '' '/CODE_SIGN_IDENTITY/d' App.xcodeproj/project.pbxproj
          echo "--- after ---"
          grep -n 'CODE_SIGN_IDENTITY' App.xcodeproj/project.pbxproj || echo "(none, which is the point)"

      - name: Install the App Store Connect key
        env:
          KEY_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys ~/.private_keys ~/.appstoreconnect/private_keys
          printf '%s' "$KEY_B64" | tr -dc 'A-Za-z0-9+/=' | base64 -d > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8
          if ! head -1 ~/private_keys/AuthKey_${KEY_ID}.p8 | grep -q 'BEGIN PRIVATE KEY'; then
            echo "ASC_KEY_P8_B64 did not decode to a PEM private key."
            exit 1
          fi
          # altool discovers keys in several places; cover them all.
          cp ~/private_keys/AuthKey_${KEY_ID}.p8 ~/.private_keys/
          cp ~/private_keys/AuthKey_${KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          echo "key installed"

      # MANUAL signing: xcodebuild's cloud signing (-allowProvisioningUpdates)
      # died with "Unauthenticated" on every key this account owns, so the
      # export signs with a real certificate instead. We hold the private key
      # of the account's existing Apple Distribution certificate; the App Store
      # profile was created once via the ASC API and lives in the secrets.
      - name: Load the signing certificate and profile
        env:
          KEY_PEM_B64: ${{ secrets.SIGNING_KEY_PEM_B64 }}
          CERT_DER_B64: ${{ secrets.SIGNING_CERT_DER_B64 }}
          PROF_B64: ${{ secrets.PROFILE_B64 }}
          PROF_UUID: ${{ secrets.PROFILE_UUID }}
        run: |
          cd "$RUNNER_TEMP"
          PROF_UUID=$(printf '%s' "$PROF_UUID" | tr -d '[:space:]')
          printf '%s' "$KEY_PEM_B64" | tr -dc 'A-Za-z0-9+/=' | base64 -d > signkey.pem
          printf '%s' "$CERT_DER_B64" | tr -dc 'A-Za-z0-9+/=' | base64 -d > distcert.der
          openssl x509 -inform DER -in distcert.der -out distcert.pem
          openssl x509 -in distcert.pem -noout -subject -enddate
          openssl version
          # OpenSSL 3 writes AES/PBKDF2 p12s that `security import` rejects
          # with "MAC verification failed"; the -legacy provider restores the
          # 3DES/SHA1 format the keychain accepts. LibreSSL lacks the flag and
          # writes the old format anyway — hence the fallback.
          openssl pkcs12 -export -legacy -inkey signkey.pem -in distcert.pem \
              -name "Apple Distribution" -passout pass:ci -out dist.p12 \
            || openssl pkcs12 -export -inkey signkey.pem -in distcert.pem \
              -name "Apple Distribution" -passout pass:ci -out dist.p12

          KC="$RUNNER_TEMP/flicktail.keychain-db"
          KCPASS=$(uuidgen)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import dist.p12 -k "$KC" -P ci -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo '--- identities ---'
          security find-identity -v -p codesigning

          # Xcode 16+ reads ~/Library/Developer/Xcode/UserData/Provisioning Profiles;
          # older tooling reads ~/Library/MobileDevice/Provisioning Profiles. Both.
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          printf '%s' "$PROF_B64" | tr -dc 'A-Za-z0-9+/=' | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/"$PROF_UUID".mobileprovision
          cp ~/Library/MobileDevice/Provisioning\ Profiles/"$PROF_UUID".mobileprovision \
             ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/"$PROF_UUID".mobileprovision \
            | plutil -extract Name raw -o - - || true
          echo "installed profile $PROF_UUID"

      - name: Archive (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Flicktail.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive

      # exportArchive re-signs nested code that already carries a signature and
      # SKIPS code that arrived bare (it preserves metadata, which needs an
      # existing signature). The archive was built with signing off, so the
      # Capacitor/Cordova frameworks and the app itself are bare — ad-hoc sign
      # them so export has something to replace with the distribution identity.
      # (Learned on Rushhouse as upload rejection ITMS-90035.)
      - name: Ad-hoc sign bare code so export will re-sign it
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/Flicktail.xcarchive/Products/Applications/*.app | head -1)
          echo "app: $APP"
          for fw in "$APP"/Frameworks/*; do
            [ -e "$fw" ] || continue
            if codesign -v "$fw" >/dev/null 2>&1; then
              echo "$(basename "$fw") already signed"
            else
              echo "$(basename "$fw") bare -> ad-hoc"
              codesign --force --sign - "$fw"
            fi
          done
          codesign --force --sign - "$APP" 2>/dev/null || true

      # xcodebuild -exportArchive is bypassed entirely: its cloud path returns
      # "Unauthenticated" for this account and its manual path refused to see a
      # profile that was demonstrably installed. Nothing it does here is magic —
      # embed the profile, sign with the profile's own entitlements, zip.
      - name: Package and sign the IPA by hand
        env:
          PROF_UUID: ${{ secrets.PROFILE_UUID }}
        run: |
          PROF_UUID=$(printf '%s' "$PROF_UUID" | tr -d '[:space:]')
          APP_SRC=$(ls -d "$RUNNER_TEMP"/Flicktail.xcarchive/Products/Applications/*.app | head -1)
          WORK="$RUNNER_TEMP/pack"; rm -rf "$WORK"; mkdir -p "$WORK/Payload"
          cp -R "$APP_SRC" "$WORK/Payload/"
          APP="$WORK/Payload/$(basename "$APP_SRC")"
          PROF=~/Library/MobileDevice/Provisioning\ Profiles/"$PROF_UUID".mobileprovision

          cp "$PROF" "$APP/embedded.mobileprovision"
          security cms -D -i "$PROF" > "$WORK/profile.plist"
          plutil -extract Entitlements xml1 -o "$WORK/ent.plist" "$WORK/profile.plist"
          echo '--- entitlements from the profile ---'
          /usr/libexec/PlistBuddy -c "Print" "$WORK/ent.plist"

          IDENT=$(security find-identity -v -p codesigning | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          echo "signing as: [$IDENT]"
          test -n "$IDENT"

          for fw in "$APP"/Frameworks/*; do
            [ -e "$fw" ] || continue
            codesign --force --sign "$IDENT" "$fw"
          done
          codesign --force --sign "$IDENT" --entitlements "$WORK/ent.plist" "$APP"
          codesign --verify --deep --strict "$APP"
          echo '--- signed as ---'
          codesign -dvv "$APP" 2>&1 | grep -E 'Authority|Identifier|TeamIdentifier'

          mkdir -p "$RUNNER_TEMP/export"
          (cd "$WORK" && zip -qry "$RUNNER_TEMP/export/Flicktail.ipa" Payload)
          ls -l "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: flicktail-ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      # Fails with ITMS-90083 "could not find the app record" until the app is
      # created once on appstoreconnect.apple.com — the one step the API cannot
      # do. Everything before this still produced the signed IPA artifact.
      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight || startsWith(github.ref, 'refs/tags/v') }}
        env:
          KEY_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # A secret set from a Windows shell can carry an invisible trailing
          # CR; embedded in the key FILENAME it makes altool "not find" a file
          # that ls shows. Strip whitespace from every identifier.
          KEY_ID=$(printf '%s' "$KEY_ID" | tr -d '[:space:]')
          ISSUER=$(printf '%s' "${{ secrets.ASC_ISSUER_ID }}" | tr -d '[:space:]')
          mkdir -p "$RUNNER_TEMP/asckeys"
          printf '%s' "$KEY_B64" | tr -dc 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/asckeys/AuthKey_${KEY_ID}.p8"
          ls -la "$RUNNER_TEMP/asckeys"
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asckeys"
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER"
